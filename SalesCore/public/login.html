<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login - SalesCore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <h1 class="h3 mb-1">SalesCore</h1>
                    <p class="text-muted mb-0">Acesse sua conta</p>
                </div>

                <div id="message"></div>

                <form id="loginForm">

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" class="form-control" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Entrar
                    </button>

                </form>

                <div class="alert alert-info mt-3 mb-0 small">
                    Usuário teste: <strong>admin@salescore.com</strong><br>
                    Senha: <strong>123456</strong>
                </div>

            </div>
        </div>

    </main>

    <script>
        const LOGIN_API_URL = '/api/login';

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('salescore_token');

            if (token) {
                window.location.href = '/index.html';
                return;
            }

            document.getElementById('loginForm').addEventListener('submit', login);
        });

        async function login(event) {
            event.preventDefault();

            const credentials = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            };

            try {
                const response = await fetch(LOGIN_API_URL, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(credentials),
                });

                const responseText = await response.text();
                const data = responseText ? JSON.parse(responseText) : {};

                if (!response.ok) {
                    showMessage(data.message ?? 'E-mail ou senha inválidos.', 'danger');
                    return;
                }

                localStorage.setItem('salescore_token', data.token);
                localStorage.setItem('salescore_user', JSON.stringify(data.user));

                window.location.href = '/index.html';

            } catch (error) {
                showMessage('Erro ao fazer login: ' + error.message, 'danger');
            }
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');

            message.innerHTML = `
                <div class="alert alert-${type}" role="alert">
                    ${text}
                </div>
            `;
        }
    </script>

</body>

</html>

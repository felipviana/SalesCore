<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Formas de Pagamento - SalesCore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light" data-page="payment-methods">
    <script src="/js/auth.js"></script>
    <script>
        requireAuth();
    </script>
    <div id="appHeader"></div>

    <main class="container py-4">

        <div class="mb-4">
            <h1 class="h3 mb-1">Formas de Pagamento</h1>
            <p class="text-muted mb-0">
                Cadastro das formas de pagamento utilizadas nas vendas.
            </p>
        </div>

        <div id="message"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-header">
                Nova forma de pagamento
            </div>

            <div class="card-body">
                <form id="paymentMethodForm">
                    <input type="hidden" id="payment_method_id">

                    <div class="row g-3">

                        <div class="col-md-4">
                            <label for="name" class="form-label">Nome</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>

                        <div class="col-md-4">
                            <label for="type" class="form-label">Tipo</label>
                            <select id="type" class="form-select">
                                <option value="">Selecione...</option>
                                <option value="cash">Dinheiro</option>
                                <option value="pix">Pix</option>
                                <option value="credit_card">Cartão de crédito</option>
                                <option value="debit_card">Cartão de débito</option>
                                <option value="bank_slip">Boleto</option>
                                <option value="store_credit">Crediário</option>
                                <option value="other">Outro</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="description" class="form-label">Descrição</label>
                            <input type="text" id="description" class="form-control">
                        </div>

                        <div class="col-md-12">
                            <div class="form-check">
                                <input type="checkbox" id="active" class="form-check-input" checked>
                                <label for="active" class="form-check-label">Forma de pagamento ativa</label>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <button type="submit" id="saveButton" class="btn btn-primary">
                                Salvar forma de pagamento
                            </button>

                            <button type="button" id="cancelEditButton" class="btn btn-outline-warning d-none"
                                onclick="cancelEdit()">
                                Cancelar edição
                            </button>

                            <button type="button" class="btn btn-outline-secondary" onclick="clearPaymentMethodForm()">
                                Limpar
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Formas de pagamento cadastradas</span>

                <button class="btn btn-sm btn-outline-primary" onclick="loadPaymentMethods()">
                    Atualizar
                </button>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>

                        <tbody id="paymentMethodsTable">
                            <tr>
                                <td colspan="6" class="text-center text-muted">
                                    Carregando formas de pagamento...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script src="/js/layout.js"></script>

    <script>
        const PAYMENT_METHODS_API_URL = '/api/payment-methods';

        document.addEventListener('DOMContentLoaded', () => {
            loadPaymentMethods();

            document.getElementById('paymentMethodForm').addEventListener('submit', savePaymentMethod);
        });

        async function loadPaymentMethods() {
            const table = document.getElementById('paymentMethodsTable');

            table.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-muted">
                        Carregando formas de pagamento...
                    </td>
                </tr>
            `;

            try {
                const response = await fetch(PAYMENT_METHODS_API_URL, {
                    headers: getAuthHeaders()
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const paymentMethods = await response.json();

                if (paymentMethods.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center text-muted">
                                Nenhuma forma de pagamento cadastrada.
                            </td>
                        </tr>
                    `;
                    return;
                }

                table.innerHTML = '';

                paymentMethods.forEach(paymentMethod => {
                    table.innerHTML += `
                        <tr>
                            <td>${paymentMethod.id}</td>
                            <td>${paymentMethod.name}</td>
                            <td>${formatPaymentType(paymentMethod.type)}</td>
                            <td>${paymentMethod.description ?? '-'}</td>
                            <td>
                                ${isActive(paymentMethod.active)
                            ? '<span class="badge bg-success">Ativa</span>'
                            : '<span class="badge bg-secondary">Inativa</span>'
                        }
                            </td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="editPaymentMethod(${paymentMethod.id})">
                                    Editar
                                </button>

                                <button class="btn btn-sm btn-outline-danger" onclick="deletePaymentMethod(${paymentMethod.id})">
                                    Excluir
                                </button>
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                table.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger">
                            Erro ao carregar formas de pagamento: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }

        async function savePaymentMethod(event) {
            event.preventDefault();

            const paymentMethodId = document.getElementById('payment_method_id').value;

            const paymentMethod = {
                name: document.getElementById('name').value,
                type: document.getElementById('type').value || null,
                description: document.getElementById('description').value || null,
                active: document.getElementById('active').checked
            };

            const isEditing = paymentMethodId !== '';

            const url = isEditing
                ? `${PAYMENT_METHODS_API_URL}/${paymentMethodId}`
                : PAYMENT_METHODS_API_URL;

            const method = isEditing ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: getAuthJsonHeaders(),
                    body: JSON.stringify(paymentMethod)
                });

                const data = await response.json();

                if (!response.ok) {
                    showValidationErrors(data);
                    return;
                }

                showMessage(
                    isEditing
                        ? 'Forma de pagamento atualizada com sucesso.'
                        : 'Forma de pagamento cadastrada com sucesso.',
                    'success'
                );

                clearPaymentMethodForm();
                loadPaymentMethods();

            } catch (error) {
                showMessage('Erro ao salvar forma de pagamento: ' + error.message, 'danger');
            }
        }

        async function editPaymentMethod(id) {
            try {
                const response = await fetch(`${PAYMENT_METHODS_API_URL}/${id}`, {
                    headers: getAuthHeaders()
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const paymentMethod = await response.json();

                document.getElementById('payment_method_id').value = paymentMethod.id;
                document.getElementById('name').value = paymentMethod.name ?? '';
                document.getElementById('type').value = paymentMethod.type ?? '';
                document.getElementById('description').value = paymentMethod.description ?? '';
                document.getElementById('active').checked = isActive(paymentMethod.active);

                document.getElementById('saveButton').textContent = 'Atualizar forma de pagamento';
                document.getElementById('cancelEditButton').classList.remove('d-none');

                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

            } catch (error) {
                showMessage('Erro ao carregar forma de pagamento para edição: ' + error.message, 'danger');
            }
        }

        async function deletePaymentMethod(id) {
            const confirmed = confirm('Deseja realmente excluir esta forma de pagamento?');

            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(`${PAYMENT_METHODS_API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message ?? `Erro HTTP: ${response.status}`);
                }

                showMessage('Forma de pagamento excluída com sucesso.', 'success');
                loadPaymentMethods();

            } catch (error) {
                showMessage('Erro ao excluir forma de pagamento: ' + error.message, 'danger');
            }
        }

        function cancelEdit() {
            clearPaymentMethodForm();
            showMessage('Edição cancelada.', 'warning');
        }

        function clearPaymentMethodForm() {
            document.getElementById('paymentMethodForm').reset();

            document.getElementById('payment_method_id').value = '';
            document.getElementById('active').checked = true;

            document.getElementById('saveButton').textContent = 'Salvar forma de pagamento';
            document.getElementById('cancelEditButton').classList.add('d-none');
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');

            message.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${text}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        function showValidationErrors(data) {
            if (!data.errors) {
                showMessage(data.message ?? 'Erro ao validar os dados.', 'danger');
                return;
            }

            let errorList = '<ul class="mb-0">';

            Object.values(data.errors).forEach(fieldErrors => {
                fieldErrors.forEach(error => {
                    errorList += `<li>${error}</li>`;
                });
            });

            errorList += '</ul>';

            showMessage(errorList, 'danger');
        }

        function formatPaymentType(type) {
            const types = {
                cash: 'Dinheiro',
                pix: 'Pix',
                credit_card: 'Cartão de crédito',
                debit_card: 'Cartão de débito',
                bank_slip: 'Boleto',
                store_credit: 'Crediário',
                other: 'Outro'
            };

            return types[type] ?? '-';
        }

        function isActive(value) {
            return value === true || value === 1 || value === '1';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

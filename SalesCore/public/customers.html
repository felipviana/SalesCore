<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Clientes - SalesCore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light" data-page="customers">

    <div id="appHeader"></div>

    <main class="container py-4">

        <div class="mb-4">
            <h1 class="h3 mb-1">Clientes</h1>
            <p class="text-muted mb-0">
                Cadastro e gerenciamento de clientes.
            </p>
        </div>

        <div id="message"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-header">
                Novo cliente
            </div>

            <div class="card-body">
                <form id="customerForm">
                    <input type="hidden" id="customer_id">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="name" class="form-label">Nome do cliente</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>

                        <div class="col-md-3">
                            <label for="document" class="form-label">CPF/CNPJ</label>
                            <input type="text" id="document" class="form-control">
                        </div>

                        <div class="col-md-3">
                            <label for="phone" class="form-label">Telefone</label>
                            <input type="text" id="phone" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" id="email" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label for="address" class="form-label">Endereço</label>
                            <input type="text" id="address" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label for="city" class="form-label">Cidade</label>
                            <input type="text" id="city" class="form-control">
                        </div>

                        <div class="col-md-2">
                            <label for="state" class="form-label">UF</label>
                            <input type="text" id="state" class="form-control" maxlength="2">
                        </div>

                        <div class="col-md-2 d-flex align-items-end">
                            <div class="form-check mb-2">
                                <input type="checkbox" id="active" class="form-check-input" checked>
                                <label for="active" class="form-check-label">Ativo</label>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <button type="submit" id="saveButton" class="btn btn-primary">
                                Salvar cliente
                            </button>

                            <button type="button" id="cancelEditButton" class="btn btn-outline-warning d-none"
                                onclick="cancelEdit()">
                                Cancelar edição
                            </button>

                            <button type="button" class="btn btn-outline-secondary" onclick="clearCustomerForm()">
                                Limpar
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Clientes cadastrados</span>

                <button class="btn btn-sm btn-outline-primary" onclick="loadCustomers()">
                    Atualizar
                </button>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Documento</th>
                                <th>Telefone</th>
                                <th>E-mail</th>
                                <th>Cidade/UF</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>

                        <tbody id="customersTable">
                            <tr>
                                <td colspan="8" class="text-center text-muted">
                                    Carregando clientes...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
    <script src="/js/layout.js"></script>
    <script>
        const CUSTOMERS_API_URL = '/api/customers';

        document.addEventListener('DOMContentLoaded', () => {
            loadCustomers();

            document.getElementById('customerForm').addEventListener('submit', saveCustomer);
        });

        async function loadCustomers() {
            const table = document.getElementById('customersTable');

            table.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center text-muted">
                        Carregando clientes...
                    </td>
                </tr>
            `;

            try {
                const response = await fetch(CUSTOMERS_API_URL, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const customers = await response.json();

                if (customers.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="8" class="text-center text-muted">
                                Nenhum cliente cadastrado.
                            </td>
                        </tr>
                    `;
                    return;
                }

                table.innerHTML = '';

                customers.forEach(customer => {
                    table.innerHTML += `
                        <tr>
                            <td>${customer.id}</td>
                            <td>${customer.name}</td>
                            <td>${customer.document ?? '-'}</td>
                            <td>${customer.phone ?? '-'}</td>
                            <td>${customer.email ?? '-'}</td>
                            <td>${formatCityState(customer.city, customer.state)}</td>
                            <td>
                                ${isActive(customer.active)
                            ? '<span class="badge bg-success">Ativo</span>'
                            : '<span class="badge bg-secondary">Inativo</span>'
                        }
                            </td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="editCustomer(${customer.id})">
                                    Editar
                                </button>

                                <button class="btn btn-sm btn-outline-danger" onclick="deleteCustomer(${customer.id})">
                                    Excluir
                                </button>
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                table.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center text-danger">
                            Erro ao carregar clientes: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }

        async function saveCustomer(event) {
            event.preventDefault();

            const customerId = document.getElementById('customer_id').value;

            const customer = {
                name: document.getElementById('name').value,
                document: document.getElementById('document').value || null,
                phone: document.getElementById('phone').value || null,
                email: document.getElementById('email').value || null,
                address: document.getElementById('address').value || null,
                city: document.getElementById('city').value || null,
                state: document.getElementById('state').value || null,
                active: document.getElementById('active').checked
            };

            const isEditing = customerId !== '';

            const url = isEditing ? `${CUSTOMERS_API_URL}/${customerId}` : CUSTOMERS_API_URL;
            const method = isEditing ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(customer)
                });

                const data = await response.json();

                if (!response.ok) {
                    showValidationErrors(data);
                    return;
                }

                showMessage(
                    isEditing ? 'Cliente atualizado com sucesso.' : 'Cliente cadastrado com sucesso.',
                    'success'
                );

                clearCustomerForm();
                loadCustomers();

            } catch (error) {
                showMessage('Erro ao salvar cliente: ' + error.message, 'danger');
            }
        }

        async function editCustomer(id) {
            try {
                const response = await fetch(`${CUSTOMERS_API_URL}/${id}`, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const customer = await response.json();

                document.getElementById('customer_id').value = customer.id;
                document.getElementById('name').value = customer.name ?? '';
                document.getElementById('document').value = customer.document ?? '';
                document.getElementById('phone').value = customer.phone ?? '';
                document.getElementById('email').value = customer.email ?? '';
                document.getElementById('address').value = customer.address ?? '';
                document.getElementById('city').value = customer.city ?? '';
                document.getElementById('state').value = customer.state ?? '';
                document.getElementById('active').checked = isActive(customer.active);

                document.getElementById('saveButton').textContent = 'Atualizar cliente';
                document.getElementById('cancelEditButton').classList.remove('d-none');

                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

            } catch (error) {
                showMessage('Erro ao carregar cliente para edição: ' + error.message, 'danger');
            }
        }

        async function deleteCustomer(id) {
            const confirmed = confirm('Deseja realmente excluir este cliente?');

            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(`${CUSTOMERS_API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message ?? `Erro HTTP: ${response.status}`);
                }

                showMessage('Cliente excluído com sucesso.', 'success');
                loadCustomers();

            } catch (error) {
                showMessage('Erro ao excluir cliente: ' + error.message, 'danger');
            }
        }

        function cancelEdit() {
            clearCustomerForm();
            showMessage('Edição cancelada.', 'warning');
        }

        function clearCustomerForm() {
            document.getElementById('customerForm').reset();

            document.getElementById('customer_id').value = '';
            document.getElementById('active').checked = true;

            document.getElementById('saveButton').textContent = 'Salvar cliente';
            document.getElementById('cancelEditButton').classList.add('d-none');
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');

            message.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${text}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        function showValidationErrors(data) {
            if (!data.errors) {
                showMessage(data.message ?? 'Erro ao validar os dados.', 'danger');
                return;
            }

            let errorList = '<ul class="mb-0">';

            Object.values(data.errors).forEach(fieldErrors => {
                fieldErrors.forEach(error => {
                    errorList += `<li>${error}</li>`;
                });
            });

            errorList += '</ul>';

            showMessage(errorList, 'danger');
        }

        function formatCityState(city, state) {
            if (city && state) {
                return `${city}/${state}`;
            }

            if (city) {
                return city;
            }

            if (state) {
                return state;
            }

            return '-';
        }

        function isActive(value) {
            return value === true || value === 1 || value === '1';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

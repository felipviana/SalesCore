<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Produtos - SalesCore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a href="/index.html" class="navbar-brand mb-0 h1 text-decoration-none">
                SalesCore
            </a>

            <div class="d-flex gap-2">
                <a href="/categories.html" class="btn btn-outline-light btn-sm">
                    Categorias
                </a>

                <a href="/suppliers.html" class="btn btn-outline-light btn-sm">
                    Fornecedores
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Produtos</h1>
                <p class="text-muted mb-0">Cadastro e listagem de mercadorias.</p>
            </div>
        </div>

        <div id="message"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-header">
                Novo produto
            </div>

            <div class="card-body">
                <form id="productForm">
                    <input type="hidden" id="product_id">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="name" class="form-label">Nome do produto</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>

                        <div class="col-md-3">
                            <label for="category_id" class="form-label">Categoria</label>
                            <select id="category_id" class="form-select">
                                <option value="">Selecione...</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label for="supplier_id" class="form-label">Fornecedor</label>
                            <select id="supplier_id" class="form-select">
                                <option value="">Selecione...</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label for="sku" class="form-label">Código interno</label>
                            <input type="text" id="sku" class="form-control">
                        </div>

                        <div class="col-md-3">
                            <label for="barcode" class="form-label">Código de barras</label>
                            <input type="text" id="barcode" class="form-control">
                        </div>

                        <div class="col-md-2">
                            <label for="unit" class="form-label">Unidade</label>
                            <input type="text" id="unit" class="form-control" value="UN" required>
                        </div>

                        <div class="col-md-2">
                            <label for="cost_price" class="form-label">Preço custo</label>
                            <input type="number" step="0.01" min="0" id="cost_price" class="form-control" value="0">
                        </div>

                        <div class="col-md-2">
                            <label for="sale_price" class="form-label">Preço venda</label>
                            <input type="number" step="0.01" min="0.01" id="sale_price" class="form-control" required>
                        </div>

                        <div class="col-md-3">
                            <label for="stock_quantity" class="form-label">Estoque atual</label>
                            <input type="number" step="0.001" min="0" id="stock_quantity" class="form-control"
                                value="0">
                        </div>

                        <div class="col-md-3">
                            <label for="minimum_stock" class="form-label">Estoque mínimo</label>
                            <input type="number" step="0.001" min="0" id="minimum_stock" class="form-control" value="0">
                        </div>

                        <div class="col-md-12">
                            <div class="form-check">
                                <input type="checkbox" id="active" class="form-check-input" checked>
                                <label for="active" class="form-check-label">Produto ativo</label>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <button type="submit" id="saveButton" class="btn btn-primary">
                                Salvar produto
                            </button>

                            <button type="button" id="cancelEditButton" class="btn btn-outline-warning d-none"
                                onclick="cancelEdit()">
                                Cancelar edição
                            </button>

                            <button type="button" class="btn btn-outline-secondary" onclick="clearProductForm()">
                                Limpar
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Produtos cadastrados</span>

                <button class="btn btn-sm btn-outline-primary" onclick="loadProducts()">
                    Atualizar
                </button>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Código</th>
                                <th>Categoria</th>
                                <th>Fornecedor</th>
                                <th>Unidade</th>
                                <th>Preço venda</th>
                                <th>Estoque</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>

                        <tbody id="productsTable">
                            <tr>
                                <td colspan="10" class="text-center text-muted">
                                    Carregando produtos...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script>
        const PRODUCTS_API_URL = '/api/products';
        const CATEGORIES_API_URL = '/api/categories';
        const SUPPLIERS_API_URL = '/api/suppliers';

        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadSuppliers();
            loadProducts();

            document.getElementById('productForm').addEventListener('submit', saveProduct);
        });

        async function loadProducts() {
            const table = document.getElementById('productsTable');

            table.innerHTML = `
                <tr>
                    <td colspan="10" class="text-center text-muted">
                        Carregando produtos...
                    </td>
                </tr>
            `;

            try {
                const response = await fetch(PRODUCTS_API_URL, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const products = await response.json();

                if (products.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="10" class="text-center text-muted">
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                    `;
                    return;
                }

                table.innerHTML = '';

                products.forEach(product => {
                    table.innerHTML += `
                        <tr>
                            <td>${product.id}</td>
                            <td>${product.name}</td>
                            <td>${product.sku ?? '-'}</td>
                            <td>${product.category?.name ?? '-'}</td>
                            <td>${product.supplier?.name ?? '-'}</td>
                            <td>${product.unit}</td>
                            <td>R$ ${formatNumber(product.sale_price)}</td>
                            <td>${formatNumber(product.stock_quantity)}</td>
                            <td>
                                ${isActive(product.active)
                            ? '<span class="badge bg-success">Ativo</span>'
                            : '<span class="badge bg-secondary">Inativo</span>'
                        }
                            </td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="editProduct(${product.id})">
                                    Editar
                                </button>

                                <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${product.id})">
                                    Excluir
                                </button>
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                table.innerHTML = `
                    <tr>
                        <td colspan="10" class="text-center text-danger">
                            Erro ao carregar produtos: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }

        async function loadCategories() {
            const categorySelect = document.getElementById('category_id');

            categorySelect.innerHTML = `
                <option value="">Selecione...</option>
            `;

            try {
                const response = await fetch(CATEGORIES_API_URL, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const categories = await response.json();

                categories.forEach(category => {
                    if (isActive(category.active)) {
                        categorySelect.innerHTML += `
                            <option value="${category.id}">
                                ${category.name}
                            </option>
                        `;
                    }
                });

            } catch (error) {
                showMessage('Erro ao carregar categorias: ' + error.message, 'danger');
            }
        }

        async function loadSuppliers() {
            const supplierSelect = document.getElementById('supplier_id');

            supplierSelect.innerHTML = `
                <option value="">Selecione...</option>
            `;

            try {
                const response = await fetch(SUPPLIERS_API_URL, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const suppliers = await response.json();

                suppliers.forEach(supplier => {
                    if (isActive(supplier.active)) {
                        supplierSelect.innerHTML += `
                            <option value="${supplier.id}">
                                ${supplier.name}
                            </option>
                        `;
                    }
                });

            } catch (error) {
                showMessage('Erro ao carregar fornecedores: ' + error.message, 'danger');
            }
        }

        async function saveProduct(event) {
            event.preventDefault();

            const productId = document.getElementById('product_id').value;

            const product = {
                category_id: document.getElementById('category_id').value || null,
                supplier_id: document.getElementById('supplier_id').value || null,
                name: document.getElementById('name').value,
                sku: document.getElementById('sku').value || null,
                barcode: document.getElementById('barcode').value || null,
                unit: document.getElementById('unit').value || 'UN',
                cost_price: Number(document.getElementById('cost_price').value || 0),
                sale_price: Number(document.getElementById('sale_price').value),
                stock_quantity: Number(document.getElementById('stock_quantity').value || 0),
                minimum_stock: Number(document.getElementById('minimum_stock').value || 0),
                active: document.getElementById('active').checked
            };

            const isEditing = productId !== '';

            const url = isEditing ? `${PRODUCTS_API_URL}/${productId}` : PRODUCTS_API_URL;
            const method = isEditing ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(product)
                });

                const data = await response.json();

                if (!response.ok) {
                    showValidationErrors(data);
                    return;
                }

                showMessage(
                    isEditing ? 'Produto atualizado com sucesso.' : 'Produto cadastrado com sucesso.',
                    'success'
                );

                clearProductForm();
                loadProducts();

            } catch (error) {
                showMessage('Erro ao salvar produto: ' + error.message, 'danger');
            }
        }

        async function editProduct(id) {
            try {
                const response = await fetch(`${PRODUCTS_API_URL}/${id}`, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const product = await response.json();

                document.getElementById('product_id').value = product.id;
                document.getElementById('category_id').value = product.category_id ?? '';
                document.getElementById('supplier_id').value = product.supplier_id ?? '';
                document.getElementById('name').value = product.name ?? '';
                document.getElementById('sku').value = product.sku ?? '';
                document.getElementById('barcode').value = product.barcode ?? '';
                document.getElementById('unit').value = product.unit ?? 'UN';
                document.getElementById('cost_price').value = product.cost_price ?? 0;
                document.getElementById('sale_price').value = product.sale_price ?? '';
                document.getElementById('stock_quantity').value = product.stock_quantity ?? 0;
                document.getElementById('minimum_stock').value = product.minimum_stock ?? 0;
                document.getElementById('active').checked = isActive(product.active);

                document.getElementById('saveButton').textContent = 'Atualizar produto';
                document.getElementById('cancelEditButton').classList.remove('d-none');

                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

            } catch (error) {
                showMessage('Erro ao carregar produto para edição: ' + error.message, 'danger');
            }
        }

        async function deleteProduct(id) {
            const confirmed = confirm('Deseja realmente excluir este produto?');

            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(`${PRODUCTS_API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message ?? `Erro HTTP: ${response.status}`);
                }

                showMessage('Produto excluído com sucesso.', 'success');
                loadProducts();

            } catch (error) {
                showMessage('Erro ao excluir produto: ' + error.message, 'danger');
            }
        }

        function cancelEdit() {
            clearProductForm();
            showMessage('Edição cancelada.', 'warning');
        }

        function clearProductForm() {
            document.getElementById('productForm').reset();

            document.getElementById('product_id').value = '';
            document.getElementById('category_id').value = '';
            document.getElementById('supplier_id').value = '';
            document.getElementById('unit').value = 'UN';
            document.getElementById('cost_price').value = 0;
            document.getElementById('stock_quantity').value = 0;
            document.getElementById('minimum_stock').value = 0;
            document.getElementById('active').checked = true;

            document.getElementById('saveButton').textContent = 'Salvar produto';
            document.getElementById('cancelEditButton').classList.add('d-none');
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');

            message.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${text}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        function showValidationErrors(data) {
            if (!data.errors) {
                showMessage(data.message ?? 'Erro ao validar os dados.', 'danger');
                return;
            }

            let errorList = '<ul class="mb-0">';

            Object.values(data.errors).forEach(fieldErrors => {
                fieldErrors.forEach(error => {
                    errorList += `<li>${error}</li>`;
                });
            });

            errorList += '</ul>';

            showMessage(errorList, 'danger');
        }

        function formatNumber(value) {
            const number = Number(value ?? 0);

            return number.toLocaleString('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 3
            });
        }

        function isActive(value) {
            return value === true || value === 1 || value === '1';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

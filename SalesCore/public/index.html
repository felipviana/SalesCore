<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>SalesCore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light" data-page="home">

    <div id="appHeader"></div>

    <main class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4">Sistema de Vendas</h1>
                <p class="text-muted">
                    Frontend em HTML + Bootstrap consumindo API Laravel.
                </p>

                <button class="btn btn-primary" onclick="testarApi()">
                    Testar API
                </button>

                <div class="mt-3">
                    <strong>Resposta:</strong>
                    <pre id="resultado" class="bg-dark text-white p-3 rounded mt-2"></pre>
                </div>
            </div>
        </div>
    </main>
    <script src="/js/layout.js"></script>
    <script>
        async function testarApi() {
            const resposta = await fetch('/api/status');
            const dados = await resposta.json();

            document.getElementById('resultado').textContent = JSON.stringify(dados, null, 2);
        }
    </script>

</body>

</html>

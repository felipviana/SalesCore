services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salescore_app
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    networks:
      - salescore_network

  nginx:
    image: nginx:alpine
    container_name: salescore_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - salescore_network

  mysql:
    image: mysql:8.0
    container_name: salescore_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sales_core_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: salescore
      MYSQL_PASSWORD: salescore
    ports:
      - "3307:3306"
    volumes:
      - salescore_mysql_data:/var/lib/mysql
    networks:
      - salescore_network

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: salescore_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - salescore_network

networks:
  salescore_network:

volumes:
  salescore_mysql_data: